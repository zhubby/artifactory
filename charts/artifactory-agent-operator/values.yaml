# [INPUT]: 独立 Agent、Runtime、Source 镜像和持久身份引用。
# [OUTPUT]: 规划服务、池预算和网络隔离参数。
# [POS]: 镜像构建使用另一个独立 Operator Chart。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
image:
  repository: ghcr.io/zhubby/artifactory-agent-operator
  tag: ""
  pullPolicy: IfNotPresent
operator:
  replicas: 2
telemetry:
  image:
    repository: ghcr.io/zhubby/artifactory-control-plane
    tag: ""
  enabled: true
  replicas: 1
  # DATABASE_URL (dedicated telemetry DB), ARTIFACTORY_BUSINESS_DATABASE_URL,
  # ARTIFACTORY_TELEMETRY_TOKEN. Business access should be read-only.
  secretName: artifactory-telemetry
  # Existing device CA and server identity: ca.pem, server.pem, server.key.
  pkiSecretName: artifactory-pki
runtime:
  image:
    repository: ghcr.io/zhubby/artifactory-planner-runtime
    tag: ""
  replicas: 1
  # Contains DATABASE_URL, ARTIFACTORY_SERVICE_KEY and ARTIFACTORY_SERVICE_TOKEN.
  secretName: artifactory-runtime
  url: https://artifactory-runtime:8091
  grpcUrl: https://artifactory-runtime:8092
controlUrl: https://artifactory-gateway-internal:8445
tls:
  # tls.crt, tls.key, ca.crt. SANs cover Runtime and all Source shard endpoints.
  secretName: artifactory-services-tls
development:
  insecureHttp: false
agentPool:
  name: default
  maxActive: 8
  maxPerProject: 4
  image: ghcr.io/zhubby/artifactory-agent-worker:0.2.0
  cpu: 250m
  memory: 512Mi
sourcePool:
  image:
    repository: ghcr.io/zhubby/artifactory-source-service
    tag: ""
  name: sources
  shards: 1
  # Independent database/role; also S3 settings and the shared service token.
  secretName: artifactory-source
  storageClass: standard
  storageSize: 20Gi
  # Device-reachable shard endpoint; supports {pod}, {pool}, {namespace}.
  # Empty uses the internal shard URL (suitable only for in-cluster devices).
  publicUrlTemplate: ''
  cpu: 250m
  memory: 1Gi
networkPolicy:
  enabled: true
