---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentpools.agents.artifactory.dev
spec:
  group: agents.artifactory.dev
  names:
    kind: AgentPool
    plural: agentpools
    singular: agentpool
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for AgentPoolSpec via `CustomResource`
        properties:
          spec:
            properties:
              controlUrl:
                type: string
              cpu:
                default: 250m
                type: string
              ephemeralStorage:
                default: 10Gi
                type: string
              image:
                type: string
              imagePullPolicy:
                default: IfNotPresent
                type: string
              maxActive:
                format: uint32
                maximum: 1000.0
                minimum: 0.0
                type: integer
              maxPerProject:
                format: uint32
                maximum: 1000.0
                minimum: 1.0
                type: integer
              memory:
                default: 512Mi
                type: string
              proxy:
                description: 管理员为执行池指定出口；内部服务必须显式列入直连清单。
                nullable: true
                properties:
                  httpProxy:
                    nullable: true
                    pattern: ^https?://[^\s\x00-\x1f\x7f]+$
                    type: string
                  httpsProxy:
                    nullable: true
                    pattern: ^https?://[^\s\x00-\x1f\x7f]+$
                    type: string
                  noProxy:
                    maxLength: 8192
                    minLength: 1
                    pattern: ^[^\x00-\x1f\x7f]+$
                    type: string
                required:
                - noProxy
                type: object
              runtimeUrl:
                type: string
              sourcePreparerImage:
                type: string
              tlsSecretName:
                default: ''
                type: string
            required:
            - controlUrl
            - image
            - maxActive
            - maxPerProject
            - runtimeUrl
            - sourcePreparerImage
            type: object
          status:
            nullable: true
            properties:
              execution:
                description: 先预留名称，再记录创建意图和 UID；停机证据先于 finalizer 移除落盘。
                nullable: true
                properties:
                  attempt:
                    format: uint32
                    maximum: 3.0
                    minimum: 1.0
                    type: integer
                  createStarted:
                    type: boolean
                  deadlineMs:
                    format: int64
                    type: integer
                  name:
                    type: string
                  nodeName:
                    nullable: true
                    type: string
                  stopped:
                    type: boolean
                  uid:
                    nullable: true
                    type: string
                required:
                - attempt
                - createStarted
                - deadlineMs
                - name
                - stopped
                type: object
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
            required:
            - observedGeneration
            - phase
            type: object
        required:
        - spec
        title: AgentPool
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: sourcetasks.agents.artifactory.dev
spec:
  group: agents.artifactory.dev
  names:
    kind: SourceTask
    plural: sourcetasks
    singular: sourcetask
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for SourceTaskSpec via `CustomResource`
        properties:
          spec:
            properties:
              cancelRequested:
                default: false
                type: boolean
              pool:
                type: string
              projectId:
                type: string
              purpose:
                enum:
                - resolve
                - refs
                type: string
              taskId:
                type: string
              tenantId:
                type: string
              timeoutSeconds:
                default: 900
                format: uint32
                maximum: 900.0
                minimum: 1.0
                type: integer
            required:
            - pool
            - projectId
            - purpose
            - taskId
            - tenantId
            type: object
            x-kubernetes-validations:
            - message: source task context is immutable
              rule: self.taskId == oldSelf.taskId && self.tenantId == oldSelf.tenantId && self.projectId == oldSelf.projectId && self.purpose == oldSelf.purpose && self.pool == oldSelf.pool && self.timeoutSeconds == oldSelf.timeoutSeconds
            - message: cancellation is irreversible
              rule: '!oldSelf.cancelRequested || self.cancelRequested'
          status:
            nullable: true
            properties:
              execution:
                description: 先预留名称，再记录创建意图和 UID；停机证据先于 finalizer 移除落盘。
                nullable: true
                properties:
                  attempt:
                    format: uint32
                    maximum: 3.0
                    minimum: 1.0
                    type: integer
                  createStarted:
                    type: boolean
                  deadlineMs:
                    format: int64
                    type: integer
                  name:
                    type: string
                  nodeName:
                    nullable: true
                    type: string
                  stopped:
                    type: boolean
                  uid:
                    nullable: true
                    type: string
                required:
                - attempt
                - createStarted
                - deadlineMs
                - name
                - stopped
                type: object
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
            required:
            - observedGeneration
            - phase
            type: object
        required:
        - spec
        title: SourceTask
        type: object
    served: true
    storage: true
    subresources:
      status: {}
