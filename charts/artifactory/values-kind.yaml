# [INPUT]: 本机 kind、NodePort 与开发 HTTP 开关。
# [OUTPUT]: 配置本机入口和数据库、对象存储容量。
# [POS]: 仅供本机服务开发；任务源码仍使用临时卷。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
development:
  insecureHttp: true
console:
  publicUrl: http://127.0.0.1:31080
  service:
    type: NodePort
    nodePort: 31080
grpc:
  service:
    type: NodePort
    nodePort: 31443
persistence:
  storageClass: standard
  postgres: 1Gi
  s3: 2Gi
