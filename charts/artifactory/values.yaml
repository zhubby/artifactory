# [INPUT]: 服务镜像、私有凭据引用、节点预算和入口地址。
# [OUTPUT]: Control、统一 Pingora、存储和规划工作负载参数。
# [POS]: 只声明部署配置，持久 Secret 由初始化脚本生成。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}

images:
  control-plane:
    repository: ghcr.io/zhubby/artifactory-control-plane
    tag: "" # Defaults to Chart.appVersion; set this to a published release tag.
    pullPolicy: IfNotPresent
  web:
    repository: ghcr.io/zhubby/artifactory-web
    tag: ""
    pullPolicy: IfNotPresent
  gateway:
    repository: ghcr.io/zhubby/artifactory-gateway
    tag: ""
    pullPolicy: IfNotPresent
  postgres:
    repository: timescale/timescaledb
    tag: 2.32.0-pg17
    pullPolicy: IfNotPresent
  s3:
    repository: chrislusf/seaweedfs
    tag: "4.53"
    pullPolicy: IfNotPresent

# Created separately by scripts/init-helm.py, never generated during upgrades.
# Empty names select <release>-credentials and <release>-pki.
secrets:
  credentials: ""
  pki: ""

controlPlane:
  replicas: 1
  databaseConnections: 20
  artifactVerifications: 4
  schedulerBatch: 64
  # Use a separate source-free planning run for node placement.
  aiPlacement: false
  # Optional pre-created Secret containing keys.json; copied privately into tmpfs.
  signingKeysSecret: ""
  drainSeconds: 5
  temporaryStorage: 10Gi
  # Optional ConfigMap containing emissary-releases.json; mounted on every replica.
  releaseSourceConfigMap: ""
postgres:
  enabled: true
  maxConnections: 100

auth:
  registrationEnabled: true

console:
  publicUrl: https://build.example.com
  service:
    type: ClusterIP
    nodePort: null

grpc:
  service:
    type: ClusterIP
    nodePort: null
    telemetryNodePort: null

telemetry:
  enabled: true
  replicas: 1
  writeConnections: 12
  readConnections: 4
  authorizationConnections: 4
  # Device-reachable TLS endpoint. Include this host in init-helm.py --grpc-host.
  endpoint: https://build.example.com:8444
  # Backend only. Publish devices through grpc.service; other values are rejected.
  service:
    type: ClusterIP
    nodePort: null
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '2', memory: 512Mi}

s3:
  enabled: true
  # Private endpoint reachable only by Control and Gateway.
  # Empty selects the embedded ClusterIP service over private HTTP.
  endpoint: ""
  # Explicit opt-in for an external private HTTP endpoint.
  allowHttp: false
  bucket: artifactory
  region: us-east-1
  service:
    type: ClusterIP
    nodePort: null

development:
  insecureHttp: false

ingress:
  enabled: false
  className: ""
  annotations: {}
  consoleHost: build.example.com
  consoleTlsSecret: artifactory-console-tls

# PVCs survive helm uninstall; removing a namespace still deletes its PVCs.
persistence:
  storageClass: "" # Use the cluster default; "-" disables dynamic provisioning.
  postgres: 5Gi
  s3: 20Gi
resources:
  control-plane:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "2", memory: 512Mi}
  web:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  gateway:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {cpu: 500m, memory: 128Mi}
  postgres:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
  s3:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 768Mi}

# Runtime are installed by the separate artifactory-agent-operator release.
# Kubernetes Job is the only planning backend.
planning:
  runtimeUrl: ""
  namespace: ""
  agentPool: default
  serviceSecretName: ""
  serviceCaSecretName: ""

gateway:
  replicas: 2
  # Optional ca.pem/server.pem/server.key for an existing service CA.
  # Empty selects the device PKI; Runtime must trust its CA.
  internalTlsSecret: ''
  # Secret key token; empty selects <release>-gateway.
  secretName: ''
  httpConnections: 1024
  deviceConnections: 4096
  telemetryConnections: 4096
  internalConnections: 1024
  registryUrl: http://artifactory-registry:5000
  networkPolicy:
    enabled: true
    # 原生 NetworkPolicy peer；空数组允许所有公开入口来源。
    publicFrom: []
    deviceFrom: []
imageBuilds:
  enabled: false
  namespace: '' # Defaults to this release namespace.
  registryUrl: https://build.example.com
  controlUrl: https://build.example.com
  # Independent RSA tls.key and tls.crt, never the device CA.
  signingSecret: '' # Empty selects <release>-registry-signing.
  registryService: artifactory-registry
  registryIssuer: artifactory
