# [INPUT]: 主 Chart 参数与无状态 Control 容量约束。
# [OUTPUT]: 配置 Control 多副本与数据库连接预算。
# [POS]: HA 覆盖参数；外部数据库与对象存储另行配置。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
controlPlane:
  replicas: 3
  databaseConnections: 40
  artifactVerifications: 4
  schedulerBatch: 64
  drainSeconds: 5
postgres:
  # Also reserve for terminating Pods overlapping the next rollout step.
  maxConnections: 450
telemetry:
  replicas: 2
  writeConnections: 12
  readConnections: 4
  authorizationConnections: 4
resources:
  control-plane:
    requests: {cpu: "1", memory: 512Mi}
    limits: {cpu: "4", memory: 2Gi}
  postgres:
    requests: {cpu: "1", memory: 1Gi}
    limits: {cpu: "4", memory: 4Gi}
# This overlay replicates Control only. Configure external HA PostgreSQL and S3
# in deployment values, with postgres.enabled=false / s3.enabled=false and the
# existing credentials Secret pointing to those services. Include surge and
# terminating Control/Telemetry pools and operational connections.
