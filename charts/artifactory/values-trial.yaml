# [INPUT]: 隔离集群的资源预算与本机公开入口。
# [OUTPUT]: 三副本 Control 与私有内建 S3 的试用参数。
# [POS]: 只用于新命名空间，不覆盖历史固定镜像配置。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
controlPlane:
  replicas: 3
  databaseConnections: 20
  temporaryStorage: 2Gi
postgres:
  maxConnections: 200
console:
  publicUrl: http://127.0.0.1:38100
development:
  insecureHttp: true
telemetry:
  replicas: 1
  endpoint: https://artifactory-telemetry:8093
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: '1', memory: 512Mi}
resources:
  control-plane:
    requests: {cpu: 500m, memory: 256Mi, ephemeral-storage: 256Mi}
    limits: {cpu: '1', memory: 1Gi, ephemeral-storage: 3Gi}
  postgres:
    requests: {cpu: 500m, memory: 512Mi}
    limits: {cpu: '2', memory: 2Gi}
  s3:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: '1', memory: 1Gi}
