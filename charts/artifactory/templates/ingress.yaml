# [INPUT]: 单一公开域名、TLS Secret 和数据入口分流开关。
# [OUTPUT]: 只连接 Pingora Service 的 HTTP Ingress。
# [POS]: 公开控制、仓库和制品入口；S3 保持私有。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "artifactory.fullname" . }}-console
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  tls:
    - hosts: [{{ .Values.ingress.consoleHost | quote }}]
      secretName: {{ .Values.ingress.consoleTlsSecret }}
  rules:
    - host: {{ .Values.ingress.consoleHost | quote }}
      http:
        paths:
          {{- if .Values.gateway.dedicatedData }}
          {{- range $path := list "/v2" "/artifacts" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "artifactory.fullname" $ }}-gateway-data
                port: {number: 80}
          {{- end }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "artifactory.fullname" . }}-web
                port: {number: 80}
{{- end }}
