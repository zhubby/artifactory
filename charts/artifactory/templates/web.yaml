# [INPUT]: 独立 Next.js 镜像和只读运行预算。
# [OUTPUT]: 只提供页面与静态文档的 Web Deployment。
# [POS]: Pingora 通过 web-internal Service 访问页面。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-web
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: "{{ .Values.images.web.repository }}:{{ .Values.images.web.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.web.pullPolicy }}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 3000}
          readinessProbe:
            httpGet: {path: /, port: http}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 30
          resources:
            {{- toYaml .Values.resources.web | nindent 12 }}
          volumeMounts:
            - {name: web-tmp, mountPath: /tmp}
            - {name: web-cache, mountPath: /app/.next/cache}
      volumes:
        - {name: web-tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: web-cache, emptyDir: {sizeLimit: 128Mi}}
