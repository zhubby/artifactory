# [INPUT]: 依赖控制平面预算、通知 SMTP Secret、出口白名单和签名密钥环。
# [OUTPUT]: 渲染 Control、通知出口、镜像池环境和中断预算。
# [POS]: 仅向 Control 复制私有密钥环，初始化沿用控制平面资源预算。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- $root := . }}
{{- $components := list "control-plane" }}
{{- range $component := $components }}
{{- with $root }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "artifactory.fullname" . }}-{{ $component }}
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      terminationGracePeriodSeconds: 45
      {{- if and (eq $component "control-plane") (gt (int .Values.controlPlane.replicas) 1) }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: {{ .Release.Name }}
                    app.kubernetes.io/component: control-plane
      {{- end }}
      serviceAccountName: {{ include "artifactory.fullname" . }}-control
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- if and (eq $component "control-plane") .Values.controlPlane.signingKeysSecret }}
      initContainers:
        - name: signing-keyring
          image: "{{ (index .Values.images "control-plane").repository }}:{{ (index .Values.images "control-plane").tag | default .Chart.AppVersion }}"
          command: ["/bin/sh", "-ec", "umask 077; cp /run/signing-source/keys.json /run/artifactory-signing/keys.json; chmod 0600 /run/artifactory-signing/keys.json"]
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml (index .Values.resources "control-plane") | nindent 12 }}
          volumeMounts:
            - {name: signing-source, mountPath: /run/signing-source, readOnly: true}
            - {name: signing-keyring, mountPath: /run/artifactory-signing}
      {{- end }}
      containers:
        - name: {{ $component }}
          image: "{{ (index .Values.images "control-plane").repository }}:{{ (index .Values.images "control-plane").tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ (index .Values.images "control-plane").pullPolicy }}
          securityContext:
            {{- include "artifactory.containerSecurity" . | nindent 12 }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 8443}
          envFrom:
            - configMapRef:
                name: {{ include "artifactory.fullname" . }}-config
            {{- if .Values.planning.coordinatorUrl }}
            - secretRef:
                name: {{ required "planning.serviceSecretName is required with planning coordinator" .Values.planning.serviceSecretName }}
            {{- end }}
            {{- if .Values.notifications.smtpSecretName }}
            - secretRef:
                name: {{ .Values.notifications.smtpSecretName | quote }}
            {{- end }}
          env:
            - {name: ARTIFACTORY_WEBHOOK_PRIVATE_ALLOWLIST, value: {{ .Values.notifications.webhookPrivateAllowlist | quote }}}
            - {name: ARTIFACTORY_KUBERNETES_NAMESPACE, value: {{ .Values.planning.namespace | default .Release.Namespace | quote }}}
            - name: ARTIFACTORY_GATEWAY_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "artifactory.gatewaySecret" . }}, key: token}}
            {{- if and (eq $component "control-plane") .Values.imageBuilds.enabled }}
            - {name: ARTIFACTORY_IMAGE_NAMESPACE, value: {{ .Values.imageBuilds.namespace | default .Release.Namespace | quote }}}
            - {name: ARTIFACTORY_IMAGE_POOL, value: {{ .Values.imageBuilds.pool | quote }}}
            - {name: ARTIFACTORY_REGISTRY_URL, value: {{ .Values.imageBuilds.registryUrl | quote }}}
            - {name: ARTIFACTORY_IMAGE_CONTROL_URL, value: {{ .Values.imageBuilds.controlUrl | quote }}}
            - {name: ARTIFACTORY_REGISTRY_SERVICE, value: {{ .Values.imageBuilds.registryService | quote }}}
            - {name: ARTIFACTORY_REGISTRY_ISSUER, value: {{ .Values.imageBuilds.registryIssuer | quote }}}
            - {name: ARTIFACTORY_REGISTRY_SIGNING_KEY, value: /run/registry-signing/tls.key}
            - {name: ARTIFACTORY_REGISTRY_SIGNING_CERT, value: /run/registry-signing/tls.crt}
            {{- end }}
            {{- if and (eq $component "control-plane") .Values.controlPlane.signingKeysSecret }}
            - {name: ARTIFACTORY_SIGNING_KEYS_FILE, value: /run/artifactory-signing/keys.json}
            {{- end }}
            {{- if .Values.controlPlane.releaseSourceConfigMap }}
            - {name: ARTIFACTORY_EMISSARY_RELEASE_SOURCE, value: /etc/artifactory/emissary-releases.json}
            {{- end }}
            {{- $secret := include "artifactory.credentials" . }}
            {{- if .Values.telemetry.enabled }}
            - name: ARTIFACTORY_TELEMETRY_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: telemetry-token}
            {{- end }}
            {{- range $env, $key := dict "DATABASE_URL" "database-url" "ARTIFACTORY_MASTER_KEY" "master-key" "ARTIFACTORY_S3_ACCESS_KEY" "s3-access-key" "ARTIFACTORY_S3_SECRET_KEY" "s3-secret-key" "ARTIFACTORY_BOOTSTRAP_USERNAME" "bootstrap-username" "ARTIFACTORY_BOOTSTRAP_PASSWORD" "bootstrap-password" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ $key }}
            {{- end }}
          startupProbe:
            httpGet: {path: /healthz, port: http, scheme: HTTP}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /readyz, port: http, scheme: HTTP}
          livenessProbe:
            httpGet: {path: /healthz, port: http, scheme: HTTP}
            periodSeconds: 15
          resources:
            {{- toYaml (index .Values.resources "control-plane") | nindent 12 }}
          volumeMounts:
            {{- if and (eq $component "control-plane") .Values.imageBuilds.enabled }}
            - {name: registry-signing, mountPath: /run/registry-signing, readOnly: true}
            {{- end }}
            {{- if and (eq $component "control-plane") .Values.controlPlane.signingKeysSecret }}
            - {name: signing-keyring, mountPath: /run/artifactory-signing, readOnly: true}
            {{- end }}
            {{- if .Values.controlPlane.releaseSourceConfigMap }}
            - {name: release-source, mountPath: /etc/artifactory, readOnly: true}
            {{- end }}
            - {name: data, mountPath: /var/lib/artifactory}
            - {name: pki, mountPath: /run/artifactory-pki, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.planning.serviceCaSecretName }}
            - {name: service-ca, mountPath: /run/service-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- if and (eq $component "control-plane") .Values.imageBuilds.enabled }}
        - name: registry-signing
          secret: {secretName: {{ include "artifactory.registrySigningSecret" . }}, defaultMode: 0440}
        {{- end }}
        {{- if and (eq $component "control-plane") .Values.controlPlane.signingKeysSecret }}
        - name: signing-source
          secret:
            secretName: {{ .Values.controlPlane.signingKeysSecret }}
            defaultMode: 0440
            items: [{key: keys.json, path: keys.json}]
        - name: signing-keyring
          emptyDir: {medium: Memory, sizeLimit: 1Mi}
        {{- end }}
        {{- if .Values.planning.serviceCaSecretName }}
        - name: service-ca
          secret:
            secretName: {{ .Values.planning.serviceCaSecretName }}
            items: [{key: ca.crt, path: ca.crt}]
        {{- end }}
        {{- if .Values.controlPlane.releaseSourceConfigMap }}
        - name: release-source
          configMap:
            name: {{ .Values.controlPlane.releaseSourceConfigMap }}
            items: [{key: emissary-releases.json, path: emissary-releases.json}]
        {{- end }}
        - name: data
          emptyDir: {sizeLimit: {{ .Values.controlPlane.temporaryStorage }}}
        - name: pki
          secret:
            secretName: {{ include "artifactory.pki" . }}
            defaultMode: 0440
        - name: tmp
          emptyDir: {sizeLimit: 1Gi}

{{- end }}
{{- end }}
{{- if gt (int .Values.controlPlane.replicas) 1 }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "artifactory.fullname" . }}-control-plane
spec:
  minAvailable: {{ sub (int .Values.controlPlane.replicas) 1 }}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: control-plane
{{- end }}
