# [INPUT]: 固定服务入口、终端连接预算、令牌和内部 TLS 身份。
# [OUTPUT]: 双副本统一网关、内部 HTTPS 和 Web 后端 Service。
# [POS]: 同一进程监听公开 HTTP、设备透传和内部 HTTPS。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "artifactory.fullname" . }}-gateway}
spec:
  replicas: {{ .Values.gateway.replicas }}
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "artifactory.selector" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: gateway
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.gateway.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
            - {name: grpc, containerPort: 8443}
            - {name: telemetry, containerPort: 8444}
            - {name: https, containerPort: 8445}
          env:
            - {name: ARTIFACTORY_GATEWAY_PROFILE, value: "unified"}
            - {name: ARTIFACTORY_GATEWAY_ALLOW_HTTP_UPSTREAMS, value: 'true'}
            - {name: ARTIFACTORY_GATEWAY_HTTP_BIND, value: '0.0.0.0:8080'}
            - {name: ARTIFACTORY_GATEWAY_TCP_BIND, value: '0.0.0.0:8443'}
            - {name: ARTIFACTORY_GATEWAY_TELEMETRY_BIND, value: '0.0.0.0:8444'}
            - {name: ARTIFACTORY_GATEWAY_INTERNAL_BIND, value: '0.0.0.0:8445'}
            - {name: ARTIFACTORY_GATEWAY_INTERNAL_TLS_CERT, value: /run/internal-tls/server.pem}
            - {name: ARTIFACTORY_GATEWAY_INTERNAL_TLS_KEY, value: /run/internal-tls/server.key}
            - {name: ARTIFACTORY_INSECURE_DEV, value: {{ .Values.development.insecureHttp | toString | quote }}}
            - {name: ARTIFACTORY_GATEWAY_CONTROL, value: "http://{{ include "artifactory.fullname" . }}-control-plane:8080"}
            - {name: ARTIFACTORY_GATEWAY_WEB, value: "http://{{ include "artifactory.fullname" . }}-web-internal:3000"}
            - {name: ARTIFACTORY_GATEWAY_DEVICE, value: "{{ include "artifactory.fullname" . }}-control-plane:8443"}
            - {name: ARTIFACTORY_GATEWAY_TELEMETRY, value: "{{ include "artifactory.fullname" . }}-telemetry:8444"}
            - {name: ARTIFACTORY_GATEWAY_REGISTRY, value: {{ (default (printf "http://%s-registry:5000" (include "artifactory.fullname" .)) .Values.gateway.registryUrl) | quote }}}
            - {name: ARTIFACTORY_S3_ENDPOINT, value: {{ include "artifactory.s3Endpoint" . | quote }}}
            - {name: ARTIFACTORY_GATEWAY_HTTP_CONNECTIONS, value: {{ .Values.gateway.httpConnections | quote }}}
            - {name: ARTIFACTORY_GATEWAY_TERMINAL_CONNECTIONS, value: {{ .Values.gateway.terminalConnections | quote }}}
            - {name: ARTIFACTORY_GATEWAY_DEVICE_CONNECTIONS, value: {{ .Values.gateway.deviceConnections | quote }}}
            - {name: ARTIFACTORY_GATEWAY_TELEMETRY_CONNECTIONS, value: {{ .Values.gateway.telemetryConnections | quote }}}
            - {name: ARTIFACTORY_GATEWAY_INTERNAL_CONNECTIONS, value: {{ .Values.gateway.internalConnections | quote }}}
            - {name: ARTIFACTORY_SERVICE_CA, value: /run/ca/ca.crt}
            - name: ARTIFACTORY_GATEWAY_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "artifactory.gatewaySecret" . }}, key: token}}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          resources: {{ toYaml .Values.resources.gateway | nindent 12 }}
          volumeMounts:
            - {name: ca, mountPath: /run/ca, readOnly: true}
            - {name: internal-tls, mountPath: /run/internal-tls, readOnly: true}
      volumes:
        - name: ca
          secret:
            secretName: {{ include "artifactory.pki" . }}
            defaultMode: 0440
            items: [{key: ca.pem, path: ca.crt}]
        - name: internal-tls
          secret:
            secretName: {{ .Values.gateway.internalTlsSecret | default (include "artifactory.pki" .) }}
            defaultMode: 0440
            items:
              - {key: server.pem, path: server.pem}
              - {key: server.key, path: server.key}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "artifactory.fullname" . }}-gateway-internal}
spec:
  type: ClusterIP
  ports: [{name: https, port: 8445, targetPort: https}]
  selector:
    {{- include "artifactory.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "artifactory.fullname" . }}-web-internal}
spec:
  ports: [{name: http, port: 3000, targetPort: http}]
  selector:
    {{- include "artifactory.selector" . | nindent 4 }}
    app.kubernetes.io/component: web
{{- if .Values.gateway.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: {{ include "artifactory.fullname" . }}-gateway}
spec:
  podSelector:
    matchLabels:
      {{- include "artifactory.selector" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  policyTypes: [Ingress]
  ingress:
    - ports: [{port: 8080, protocol: TCP}]
      {{- with .Values.gateway.networkPolicy.publicFrom }}
      from: {{ toYaml . | nindent 8 }}
      {{- end }}
    - ports: [{port: 8443, protocol: TCP}, {port: 8444, protocol: TCP}]
      {{- with .Values.gateway.networkPolicy.deviceFrom }}
      from: {{ toYaml . | nindent 8 }}
      {{- end }}
    - ports: [{port: 8445, protocol: TCP}]
      from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: {{ list .Release.Namespace (.Values.planning.namespace | default .Release.Namespace) (.Values.imageBuilds.namespace | default .Release.Namespace) | uniq | toJson }}
{{- end }}
