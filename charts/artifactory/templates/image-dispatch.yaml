# [INPUT]: 任务命名空间、资源前缀和 Control 服务身份。
# [OUTPUT]: 源码与规划身份校验、任务声明及镜像 Secret 权限。
# [POS]: Control 验证 Pod 直接归属 CR；Operator 编排普通 Pod。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- $tokenReviewName := printf "%s-%s-source-tokenreview" (include "artifactory.fullname" .) .Release.Namespace }}
apiVersion: v1
kind: ServiceAccount
metadata: {name: {{ include "artifactory.fullname" . }}-control}
---
{{- $root := . }}
{{- range $namespace := (list (.Values.planning.namespace | default .Release.Namespace) (.Values.imageBuilds.namespace | default .Release.Namespace) | uniq) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "artifactory.fullname" $root }}-control
  namespace: {{ $namespace }}
rules:
  - apiGroups: [agents.artifactory.dev]
    resources: [sourcetasks]
    verbs: [get, create, patch]
  - apiGroups: [agents.artifactory.dev]
    resources: [agentpools, agentruns]
    verbs: [get]
  - apiGroups: [images.artifactory.dev]
    resources: [imagebuilds]
    verbs: [get, create, patch]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "artifactory.fullname" $root }}-control
  namespace: {{ $namespace }}
subjects:
  - {kind: ServiceAccount, name: {{ include "artifactory.fullname" $root }}-control, namespace: {{ $root.Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "artifactory.fullname" $root }}-control}

{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: {{ $tokenReviewName }}}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: {{ $tokenReviewName }}}
subjects:
  - {kind: ServiceAccount, name: {{ include "artifactory.fullname" . }}-control, namespace: {{ .Release.Namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ $tokenReviewName }}}
