# [INPUT]: 内建 PostgreSQL、S3 开关与持久卷参数。
# [OUTPUT]: 只创建数据库和对象存储的 PVC。
# [POS]: 任务源码与 Control 临时目录不使用持久卷。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- $components := list }}
{{- if .Values.postgres.enabled }}{{- $components = append $components "postgres" }}{{- end }}
{{- if .Values.s3.enabled }}{{- $components = append $components "s3" }}{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "artifactory.fullname" $ }}-{{ $component }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "artifactory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  accessModes: [ReadWriteOnce]
  {{- if eq $.Values.persistence.storageClass "-" }}
  storageClassName: ""
  {{- else if $.Values.persistence.storageClass }}
  storageClassName: {{ $.Values.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ index $.Values.persistence $component | quote }}
{{- end }}
