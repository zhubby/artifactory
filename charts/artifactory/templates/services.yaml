# [INPUT]: 网关多端口入口类型与私有后端端口。
# [OUTPUT]: 公开网关 Service 和含终端私有流的后端 Service。
# [POS]: 公开协议共用网关地址；内部 HTTPS 保持独立 ClusterIP。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- if or (hasKey .Values.console "service") (hasKey (.Values.grpc | default dict) "service") }}
{{- fail "console.service and grpc.service were replaced by gateway.service; migrate values before upgrading" }}
{{- end }}
{{- $settings := .Values.gateway.service }}
{{- if not (has $settings.type (list "ClusterIP" "NodePort" "LoadBalancer")) }}
{{- fail "gateway.service.type must be ClusterIP, NodePort or LoadBalancer" }}
{{- end }}
{{- $seen := dict }}
{{- range $port := list $settings.nodePorts.http $settings.nodePorts.grpc $settings.nodePorts.telemetry }}
{{- if $port }}
{{- if eq $settings.type "ClusterIP" }}
{{- fail "gateway.service.nodePorts require NodePort or LoadBalancer" }}
{{- end }}
{{- $key := $port | toString }}
{{- if hasKey $seen $key }}
{{- fail "gateway.service.nodePorts.http, grpc and telemetry must differ" }}
{{- end }}
{{- $_ := set $seen $key true }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artifactory.fullname" . }}-gateway
  labels:
    {{- include "artifactory.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ $settings.type }}
  ports:
    {{- range $entry := list (dict "name" "http" "port" 80) (dict "name" "grpc" "port" 8443) (dict "name" "telemetry" "port" 8444) }}
    - port: {{ $entry.port }}
      targetPort: {{ $entry.name }}
      name: {{ $entry.name }}
      {{- with index $settings.nodePorts $entry.name }}
      nodePort: {{ . }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "artifactory.selector" . | nindent 4 }}
    app.kubernetes.io/component: gateway
{{- $components := list "control-plane" }}
{{- if .Values.postgres.enabled }}{{- $components = append $components "timescaledb" }}{{- end }}
{{- if .Values.s3.enabled }}{{- $components = append $components "seaweedfs" }}{{- end }}
{{- range $component := $components }}
{{- $port := 5432 }}
{{- $target := "postgres" }}
{{- if eq $component "seaweedfs" }}
{{- $port = 8333 }}
{{- $target = "s3" }}
{{- else if eq $component "control-plane" }}
{{- $port = 8080 }}
{{- $target = "http" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artifactory.fullname" $ }}-{{ $component }}
  labels:
    {{- include "artifactory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $port }}
      targetPort: {{ $target }}
      name: {{ $target }}
    {{- if eq $component "control-plane" }}
    - {port: 8443, targetPort: grpc, name: grpc}
    - {port: {{ $.Values.controlPlane.terminalRelayPort }}, targetPort: terminal-relay, name: terminal-relay}
    {{- end }}
  selector:
    {{- include "artifactory.selector" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
{{- end }}
