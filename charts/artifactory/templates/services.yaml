# [INPUT]: 固定服务端口和入口类型。
# [OUTPUT]: 私有业务服务和统一网关的公开入口。
# [POS]: 公开 HTTP 与设备透传使用独立 Service 和端口。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- if and (eq .Values.grpc.service.type "NodePort") .Values.grpc.service.nodePort .Values.grpc.service.telemetryNodePort }}
{{- if eq (.Values.grpc.service.nodePort | toString) (.Values.grpc.service.telemetryNodePort | toString) }}
{{- fail "grpc.service.nodePort and grpc.service.telemetryNodePort must differ" }}
{{- end }}
{{- end }}
{{- $components := list "control-plane" "web" "grpc" }}
{{- if .Values.postgres.enabled }}{{- $components = append $components "postgres" }}{{- end }}
{{- if .Values.s3.enabled }}{{- $components = append $components "s3" }}{{- end }}
{{- if .Values.localSource.enabled }}{{- $components = append $components "local-source" }}{{- end }}
{{- range $component := $components }}
{{- $settings := dict "type" "ClusterIP" }}
{{- $port := 5432 }}
{{- $target := "postgres" }}
{{- $selector := $component }}
{{- if eq $component "s3" }}
{{- $settings = dict "type" "ClusterIP" }}
{{- $port = 8333 }}
{{- $target = "s3" }}
{{- else if or (eq $component "control-plane") (eq $component "local-source") }}
{{- $port = 8080 }}
{{- $target = "http" }}
{{- else if eq $component "web" }}
{{- $settings = $.Values.console.service }}
{{- $port = 80 }}
{{- $target = "http" }}
{{- $selector = "gateway" }}
{{- else if eq $component "grpc" }}
{{- $settings = $.Values.grpc.service }}
{{- $port = 8443 }}
{{- $target = "grpc" }}
{{- $selector = "gateway" }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "artifactory.fullname" $ }}-{{ $component }}
  labels:
    {{- include "artifactory.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  type: {{ $settings.type }}
  ports:
    - port: {{ $port }}
      targetPort: {{ $target }}
      name: {{ $target }}
      {{- if and (eq $settings.type "NodePort") $settings.nodePort }}
      nodePort: {{ $settings.nodePort }}
      {{- end }}
    {{- if eq $component "control-plane" }}
    - {port: 8443, targetPort: grpc, name: grpc}
    {{- end }}
    {{- if eq $component "grpc" }}
    - port: 8444
      targetPort: telemetry
      name: telemetry
      {{- if and (eq $settings.type "NodePort") $settings.telemetryNodePort }}
      nodePort: {{ $settings.telemetryNodePort }}
      {{- end }}
    {{- end }}
  selector:
    {{- include "artifactory.selector" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $selector }}
{{- end }}
