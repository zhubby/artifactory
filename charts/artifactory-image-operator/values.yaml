# [INPUT]: 管理员选择的镜像、节点与并发预算。
# [OUTPUT]: 独立 Image Operator、临时源码参数与分角色 BuilderPool 预算。
# [POS]: 不接收构建者提交的任意 Pod 模板。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
fullnameOverride: ""
image:
  repository: ghcr.io/zhubby/artifactory-image-operator
  tag: ''
  pullPolicy: IfNotPresent
replicas: 2
builderPool:
  name: default
  workerImage: ghcr.io/zhubby/artifactory-image-worker:0.2.0
  buildkitImage: ghcr.io/zhubby/artifactory-buildkit:0.2.0
  sourcePreparerImage: ghcr.io/zhubby/artifactory-source-preparer:0.2.0
  controlUrl: ""
  maxActive: 8
  maxPerProject: 4
  nodeSelector: {}
  emulationNodeSelector: {}
  emulationPlatforms: []
  resources:
    source: {cpu: 250m, memory: 512Mi, ephemeralStorage: 10Gi}
    runner: {cpu: 250m, memory: 256Mi, ephemeralStorage: 1Gi}
    buildkit: {cpu: '1', memory: 2Gi, ephemeralStorage: 20Gi}
    publisher: {cpu: 500m, memory: 512Mi, ephemeralStorage: 20Gi}
  caSecret: ''
  # Contains buildkitd.toml. Configure private CAs and explicit HTTP here.
  buildkitConfigMap: ''
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: '1', memory: 512Mi}
