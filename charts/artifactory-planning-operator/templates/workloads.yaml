# [INPUT]: 独立服务镜像、规划协调器地址和具名池代理。
# [OUTPUT]: 直接 Pod 控制器与 PlanningPool。
# [POS]: 规划执行资源连接控制平面的规划接口。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- $prefix := regexReplaceAll "-+$" (default "artifactory" .Values.fullnameOverride | trunc 46) "" }}
{{- $coordinatorUrl := default (printf "https://%s-gateway-internal:8445/internal/planning" $prefix) .Values.coordinator.url }}
{{- $controlUrl := default (printf "https://%s-gateway-internal:8445" $prefix) .Values.controlUrl }}
{{- $coordinatorSecret := default (printf "%s-planning" $prefix) .Values.coordinator.secretName }}
{{- $tlsSecret := default (printf "%s-services-tls" $prefix) .Values.tls.secretName }}
{{- if and (not .Values.development.insecureHttp) (or (not (hasPrefix "https://" $coordinatorUrl)) (not (hasPrefix "https://" $controlUrl))) }}
{{- fail "Planning coordinator and control plane URLs require HTTPS outside explicit development mode" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $prefix }}-planning-operator
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: artifactory-planning-worker
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $prefix }}-planning-operator
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: artifactory-planning-operator, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: artifactory-planning-operator, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      serviceAccountName: {{ $prefix }}-planning-operator
      securityContext: {runAsUser: 10001, runAsNonRoot: true}
      containers:
        - name: operator
          image: '{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}'
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: []
          env:
            - {name: RUST_LOG, value: info}
            - name: ARTIFACTORY_SERVICE_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ $coordinatorSecret }}, key: ARTIFACTORY_SERVICE_TOKEN}
            - {name: ARTIFACTORY_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: POD_UID, valueFrom: {fieldRef: {fieldPath: metadata.uid}}}
            - {name: ARTIFACTORY_PLANNING_URL, value: {{ $coordinatorUrl | quote }}}
            - {name: ARTIFACTORY_INSECURE_DEV, value: {{ .Values.development.insecureHttp | toString | quote }}}
            {{- if not .Values.development.insecureHttp }}
            - {name: ARTIFACTORY_SERVICE_CA, value: /run/service-tls/ca.crt}
            {{- end }}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: '1', memory: 512Mi}}
          {{- if not .Values.development.insecureHttp }}
          volumeMounts: [{name: tls, mountPath: /run/service-tls, readOnly: true}]
          {{- end }}
      {{- if not .Values.development.insecureHttp }}
      volumes:
        - name: tls
          secret: {secretName: {{ $tlsSecret }}, items: [{key: ca.crt, path: ca.crt}]}
      {{- end }}
---
apiVersion: planning.artifactory.dev/v1alpha1
kind: PlanningPool
metadata:
  name: {{ .Values.planningPool.name }}
spec:
  maxActive: {{ .Values.planningPool.maxActive }}
  maxPerProject: {{ .Values.planningPool.maxPerProject }}
  image: {{ .Values.planningPool.image | quote }}
  imagePullPolicy: {{ .Values.image.pullPolicy }}
  coordinatorUrl: {{ $coordinatorUrl | quote }}
  controlUrl: {{ $controlUrl | quote }}
  sourcePreparerImage: {{ .Values.planningPool.sourcePreparerImage | quote }}
  ephemeralStorage: {{ .Values.planningPool.ephemeralStorage | quote }}
  cpu: {{ .Values.planningPool.cpu | quote }}
  memory: {{ .Values.planningPool.memory | quote }}
  tlsSecretName: {{ ternary "" $tlsSecret .Values.development.insecureHttp | quote }}
  {{- with .Values.planningPool.proxy }}
  proxy: {{ toYaml . | nindent 4 }}
  {{- end }}
