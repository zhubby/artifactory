# [INPUT]: Pi Pod 标签、规划服务端口和池代理 origin。
# [OUTPUT]: 拒绝入站并限制 Pi 出站目的地的 NetworkPolicy。
# [POS]: 规划与源码任务访问 Git 及认证入口。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
{{- $prefix := regexReplaceAll "-+$" (default "artifactory" .Values.fullnameOverride | trunc 46) "" }}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $prefix }}-planning-worker
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [artifactory-planning-worker, artifactory-source-task]
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - ports:
        - {port: 8445, protocol: TCP}
        {{- range .Values.networkPolicy.gitPorts }}
        - {port: {{ . }}, protocol: TCP}
        {{- end }}
        {{- with .Values.planningPool.proxy }}
        {{- range list .httpProxy .httpsProxy }}
        {{- if . }}
        {{- $url := urlParse . }}
        {{- $port := trimPrefix ":" (regexFind ":[0-9]+$" $url.host) }}
        - {port: {{ default (ternary "443" "80" (eq $url.scheme "https")) $port | int }}, protocol: TCP}
        {{- end }}
        {{- end }}
        {{- end }}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
{{- end }}
