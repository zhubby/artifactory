# [INPUT]: 不可变原生标签、根 VERSION 与 UTF-8 Python 环境。
# [OUTPUT]: 最终资产原生维护、Linux满盘补报、ext4故障证据及六平台签名清单。
# [POS]: 标签定位源码；原生维护回退和Linux补报门禁先于发布。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
name: Emissary Release
on:
  push:
    tags: ['emissary-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to publish
        required: true
        type: string
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  native:
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: windows-11-arm
            platform: windows/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    services:
      timescale:
        image: ${{ startsWith(matrix.platform, 'linux/') && 'timescale/timescaledb:2.32.0-pg17' || '' }}
        env:
          POSTGRES_DB: artifactory
          POSTGRES_USER: artifactory
          POSTGRES_PASSWORD: local-native-test-only
          TIMESCALEDB_TELEMETRY: 'off'
        ports:
          - 127.0.0.1:15432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U artifactory -d artifactory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Verify the canonical version and native release tag
        id: source
        env:
          EMISSARY_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          python3 scripts/version.py --check --emissary-tag "$EMISSARY_TAG"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - name: Install Rust and Protobuf
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy
          rustup default 1.95.0
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y protobuf-compiler; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install protobuf; fi
          if [ "$RUNNER_OS" = Windows ]; then choco install protoc --no-progress -y; fi
      - run: cargo test --locked -p artifactory-emissary -p artifactory-execution-support --all-targets
      - run: cargo clippy --locked -p artifactory-emissary -p artifactory-execution-support --all-targets -- -D warnings
      - name: Build versioned native executable
        env:
          ARTIFACTORY_BUILD_VERSION: ${{ steps.source.outputs.version }}
        run: |
          ARTIFACTORY_BUILD_COMMIT=$(git rev-parse HEAD)
          export ARTIFACTORY_BUILD_COMMIT
          sh scripts/cross-build-emissary.sh
      - name: Verify the native executable product version
        id: native-candidate
        env:
          EMISSARY_PLATFORM: ${{ matrix.platform }}
          EMISSARY_VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -eu
          platform_name=${EMISSARY_PLATFORM/\//-}
          extension=''
          if [ "$RUNNER_OS" = Windows ]; then extension='.exe'; fi
          expected="artifactory-emissary $EMISSARY_VERSION $EMISSARY_PLATFORM protocol=1 commit=$(git rev-parse HEAD)"
          actual=$(".local/emissary-bin/artifactory-emissary-$platform_name$extension" version | tr -d '\r')
          test "$actual" = "$expected"
          binary=$(python3 -c 'from pathlib import Path; import sys; print(Path(sys.argv[1]).resolve())' ".local/emissary-bin/artifactory-emissary-$platform_name$extension")
          printf 'binary=%s\n' "$binary" >> "$GITHUB_OUTPUT"
      - name: Verify final asset with native service maintenance and rollback
        env:
          ARTIFACTORY_NATIVE_SERVICE_TESTS: '1'
          ARTIFACTORY_NATIVE_EXPECTED_PLATFORM: ${{ matrix.platform }}
          ARTIFACTORY_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/emissary-native-evidence
          ARTIFACTORY_NATIVE_BINARY: ${{ steps.native-candidate.outputs.binary }}
        run: cargo test --locked -p artifactory-emissary --test native_service native_service_lifecycle -- --ignored --exact --nocapture
      - name: Verify final Linux asset with native durable recovery
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          ARTIFACTORY_NATIVE_SERVICE_TESTS: '1'
          ARTIFACTORY_NATIVE_EXPECTED_PLATFORM: ${{ matrix.platform }}
          ARTIFACTORY_NATIVE_EVIDENCE_DIR: ${{ runner.temp }}/emissary-native-durable-evidence
          ARTIFACTORY_NATIVE_BINARY: ${{ steps.native-candidate.outputs.binary }}
          ARTIFACTORY_TEST_DATABASE_URL: postgres://artifactory:local-native-test-only@127.0.0.1:15432/artifactory
        run: |
          cargo test --locked -p artifactory-emissary --test native_service native_service_durable_recovery -- --ignored --exact --nocapture
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          proof = json.loads((Path(os.environ['ARTIFACTORY_NATIVE_EVIDENCE_DIR']) / 'durable_recovery.json').read_text())
          required = ('passed', 'native_service_executed', 'real_business_migrations',
                      'transaction_fence_observed', 'source_bytes_retained_before_commit',
                      'business_ack_removed_sources', 'terminal_operation_unchanged',
                      'service_account_directory_removed', 'database_removed')
          if any(proof.get(key) is not True for key in required):
              raise SystemExit('Native durable transaction or cleanup evidence is incomplete.')
          if proof.get('source_batches') != 2 or proof.get('source_inventories') != 3:
              raise SystemExit('Native durable original source coverage is incomplete.')
          startups = proof.get('native_startups_registered')
          if type(startups) is not int or startups < 4:
              raise SystemExit('Native maintenance/OTA/rollback startup coverage is incomplete.')
          PY
      - name: Verify Linux ext4 OTA and active spool faults
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          ARTIFACTORY_TEST_DATABASE_URL: postgres://artifactory:local-native-test-only@127.0.0.1:15432/artifactory
        run: |
          sudo apt-get install -y e2fsprogs util-linux
          python3 scripts/check_emissary_ota_filesystem.py --filesystem ext4 --with-active-spool --evidence "$RUNNER_TEMP/emissary-ota-filesystem-ext4.json"
      - name: Linux native service ENOSPC and durable recovery
        if: runner.os == 'Linux'
        timeout-minutes: 20
        shell: bash
        env:
          ARTIFACTORY_NATIVE_SERVICE_TESTS: '1'
          ARTIFACTORY_TEST_DATABASE_URL: postgres://artifactory:local-native-test-only@127.0.0.1:15432/artifactory
          ARTIFACTORY_NATIVE_BINARY: ${{ steps.native-candidate.outputs.binary }}
        run: python3 scripts/check_emissary_native_disk.py --evidence "$RUNNER_TEMP/emissary-native-disk.json"
      - name: Retain native maintenance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-evidence-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/emissary-native-evidence/*.json
            ${{ runner.temp }}/emissary-native-durable-evidence/*.json
            ${{ runner.temp }}/emissary-ota-filesystem-*.json
            ${{ runner.temp }}/emissary-native-disk.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: emissary-${{ strategy.job-index }}
          path: .local/emissary-bin/artifactory-emissary-*
          include-hidden-files: true
  publish:
    needs: native
    runs-on: ubuntu-latest
    environment: emissary-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
      - name: Verify the canonical version and native release tag
        id: source
        env:
          EMISSARY_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -eu
          python3 scripts/version.py --check --emissary-tag "$EMISSARY_TAG"
          python3 -m unittest scripts.test_version -v
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: actions/download-artifact@v4
        with:
          pattern: emissary-*
          merge-multiple: true
          path: .local/emissary-bin
      - name: Sign manifest and publish immutable assets
        env:
          EMISSARY_TAG: ${{ inputs.tag || github.ref_name }}
          EMISSARY_VERSION: ${{ steps.source.outputs.version }}
          ARTIFACTORY_EMISSARY_RELEASE_SIGNING_SEED: ${{ secrets.EMISSARY_RELEASE_SIGNING_SEED }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          revision=$(git rev-parse HEAD)
          cargo run --locked --bin emissary-release -- --directory .local/emissary-bin --version "$EMISSARY_VERSION" --commit "$revision"
          gh release create "$EMISSARY_TAG" --verify-tag --title "Emissary $EMISSARY_TAG" --generate-notes .local/emissary-bin/artifactory-emissary-* .local/emissary-bin/emissary-manifest.json .local/emissary-bin/emissary-manifest.sig
