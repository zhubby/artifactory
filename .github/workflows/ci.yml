# [INPUT]: 提交源码、固定 kind/Android 版本、protoc 与隔离租户服务。
# [OUTPUT]: 验证版本、原生签名与跨服务契约，保留脱敏失败证据。
# [POS]: 合并交付的自动化验证入口。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
name: platform-contracts
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  version-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/version.py --check
      - run: python3 -m unittest scripts.test_version -v
  linux-end-to-end:
    needs: version-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARTIFACTORY_TEST_DATABASE_URL: postgres://artifactory:local-test-only@127.0.0.1:15432/artifactory
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Validate production and kind Helm manifests
        run: |
          helm lint charts/artifactory --strict
          helm lint charts/artifactory --strict -f charts/artifactory/values-kind.yaml
          helm lint charts/artifactory --strict -f charts/artifactory/values-ha.yaml
          helm lint charts/artifactory --strict -f charts/artifactory/values-trial.yaml
          helm lint charts/artifactory-agent-operator --strict
          helm lint charts/artifactory-image-operator --strict
          helm lint charts/artifactory-registry --strict
          helm template native charts/artifactory-agent-operator > /dev/null
          helm template images charts/artifactory-image-operator > /dev/null
          helm template registry charts/artifactory-registry > /dev/null
          helm template images charts/artifactory --set imageBuilds.enabled=true,ingress.enabled=true > /dev/null
          helm template artifactory charts/artifactory --set ingress.enabled=true > /dev/null
          helm template artifactory charts/artifactory -f charts/artifactory/values-kind.yaml > /dev/null
          helm template artifactory charts/artifactory --namespace artifactory --kube-version 1.28.3 \
            -f charts/artifactory/values-trial.yaml > /dev/null
          helm template artifactory charts/artifactory -f charts/artifactory/values-ha.yaml \
            --set postgres.enabled=false,s3.enabled=false,ingress.enabled=true \
            --set s3.endpoint=https://objects.example.com > /dev/null
          if helm template artifactory charts/artifactory --set console.publicUrl=http://build.example.com > /dev/null 2>&1; then
            echo 'Production HTTP must be rejected' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;36.0.0 platforms;android-36'
      - name: Configure native Android signing test paths
        shell: bash
        run: |
          {
            echo "ARTIFACTORY_TEST_ANDROID_BUILD_TOOLS=$ANDROID_HOME/build-tools/36.0.0"
            echo "ARTIFACTORY_TEST_ANDROID_PLATFORM=$ANDROID_HOME/platforms/android-36/android.jar"
          } >> "$GITHUB_ENV"
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler openssh-server postgresql-client rclone git-lfs cmake pkg-config && sudo mkdir -p /run/sshd
      - run: npm ci && npm run check && npm test
        working-directory: packages/agent-worker
      - run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy && rustup default 1.95.0
      - name: Install pinned documentation tools
        run: |
          cargo install --locked --version 0.4.40 mdbook
          cargo install --locked --version 0.14.0 mdbook-mermaid
      - run: sh scripts/local-services.sh
      - run: python3 scripts/check_data_access.py --dependencies
      - run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python3 -m unittest discover -s tests/operator/acceptance -p 'test_*.py' -v
      - run: cargo fmt --all --check && cargo clippy --locked --all-targets -- -D warnings
      - name: Build isolated SSH source fixture
        run: docker build --platform linux/amd64 -f crates/source-checkout/tests/sshd.Dockerfile -t artifactory-source-sshd-test:ci .
      - name: Rust unit, Runtime/source checkout, business and Timescale telemetry regressions
        env:
          ARTIFACTORY_TEST_SSHD_IMAGE: artifactory-source-sshd-test:ci
        run: |
          set -a; source .local/env; set +a
          ARTIFACTORY_SERVICE_TOKEN="$(openssl rand -hex 32)"
          export ARTIFACTORY_SERVICE_TOKEN
          cargo test --locked --workspace --all-targets -- --include-ignored --skip live_emissary_protocol --skip native_service_lifecycle --skip device_fleet_load
      - name: Generated CRDs match independent Operator charts
        run: |
          cargo run --locked -q -p artifactory-agent-operator --bin artifactory-agent-crdgen > /tmp/artifactory-crds.yaml
          diff -u operators/agent-operator/config/crd/resources.yaml /tmp/artifactory-crds.yaml
          diff -u charts/artifactory-agent-operator/crds/resources.yaml /tmp/artifactory-crds.yaml
          cargo run --locked -q -p artifactory-image-operator --bin artifactory-image-crdgen > /tmp/artifactory-image-crds.yaml
          diff -u operators/image-operator/config/crd/resources.yaml /tmp/artifactory-image-crds.yaml
          diff -u charts/artifactory-image-operator/crds/resources.yaml /tmp/artifactory-image-crds.yaml
      - name: Streaming gateway and end-to-end device mTLS
        run: |
          cargo build --locked -p artifactory-gateway
          python3 tests/images/gateway.py
      - run: cargo build --locked --bin artifactory-emissary
      - run: sh scripts/cross-build-emissary.sh
      - run: npm ci && npm run typecheck && npm run build && npx playwright install --with-deps chromium
        working-directory: web
      - name: Validate complete documentation and generated links
        run: python3 scripts/check_docs.py
      - name: Production documentation routes and browser interactions
        run: npm run test:docs
        working-directory: web
      - name: Frontend locales, themes and motion
        run: npm run test:ui
        working-directory: web
        env:
          ARTIFACTORY_UI_PRODUCTION: '1'
      - name: Preserve acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-acceptance-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            web/test-results/
            web/playwright-report/
            .local/frontend-evidence/
            .local/docs-evidence/
  kubernetes-pi:
    needs: version-contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          cluster_name: operator
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          config: tests/operator/acceptance/kind-cilium.yaml
          kubectl_version: v1.37.0
          wait: 0s
      - name: Install Cilium with policy enforcement during Pod creation
        run: |
          helm upgrade --install cilium cilium --repo https://helm.cilium.io --version 1.20.4 -n kube-system \
            --set operator.replicas=1 --set envoy.enabled=false --set l7Proxy=false --set hubble.enabled=false \
            --set kubeProxyReplacement=false --set ipam.mode=kubernetes \
            --set cgroup.autoMount.enabled=false --set cgroup.hostRoot=/sys/fs/cgroup --wait --timeout 5m
          kubectl wait nodes --all --for=condition=Ready --timeout=180s
      - name: Native build dependencies and PostgreSQL 17 restore tools
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler postgresql-common rclone git-lfs
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
      - name: Build Linux images for the disposable cluster
        run: python3 -u tests/operator/acceptance/prepare.py --platform linux/amd64 --kind operator
      - name: SourceTask, init checkout, AI conversations and native artifact delivery
        run: python3 -u tests/operator/acceptance/run.py --context kind-operator --namespace artifact-operator-ci --pull-policy IfNotPresent
      - name: TimescaleDB host and managed build telemetry, outage and durable replay
        run: python3 -u tests/operator/acceptance/telemetry.py --context kind-operator --namespace artifact-operator-ci
      - name: Cancellation retains cleanup state while kubelet is unreachable
        run: python3 -u tests/operator/acceptance/cleanup.py --context kind-operator --namespace artifact-operator-ci --node-container operator-control-plane
      - name: Real Pi admission, steady CRD writes, restart and concurrent cancellation
        run: python3 -u tests/operator/load/active.py --context kind-operator --namespace artifact-operator-ci --active 8 --queued 4 --hold-seconds 30 --memory 64Mi
      - name: Cold-Pod network isolation and allowed business chain
        run: python3 -u tests/operator/acceptance/network.py --context kind-operator --namespace artifact-operator-ci --controller 'Cilium 1.20.4'
      - name: Direct Git/LFS checkout on an external host-native Linux Emissary
        run: python3 -u tests/operator/acceptance/native.py --context kind-operator --namespace artifact-operator-ci
      - name: Preserve sanitized Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-pi-diagnostics
          include-hidden-files: true
          retention-days: 7
          path: |
            .local/operator-acceptance/*/evidence.json
            .local/operator-acceptance/*/build.json
            .local/operator-acceptance/*/control-plane.log
            .local/operator-acceptance/*/native-agent-operator.log
            .local/operator-acceptance/*/native-runtime.log
            .local/operator-acceptance/*/native-telemetry.log
            .local/operator-acceptance/*/device.log
            .local/operator-load/*/evidence.json
            .local/operator-load/*-native/build.json
            .local/operator-load/*/runtime-before-restart.log
            .local/operator-load/*/runtime-failure.log
            .local/operator-load/*/operator-failure.log
  native-emissary:
    needs: version-contract
    name: native-emissary (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
          - os: macos-latest
            platform: darwin/arm64
          - os: macos-15-intel
            platform: darwin/amd64
          - os: windows-latest
            platform: windows/amd64
          - os: windows-11-arm
            platform: windows/arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust native runtime and process tree contracts
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update && sudo apt-get install -y protobuf-compiler; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install protobuf; fi
          if [ "$RUNNER_OS" = Windows ]; then choco install protoc --no-progress -y; fi
          cargo test --locked -p artifactory-emissary --all-targets
          cargo clippy --locked -p artifactory-emissary --all-targets -- -D warnings
      - name: Disposable native service lifecycle under a dedicated account
        shell: bash
        env:
          ARTIFACTORY_NATIVE_SERVICE_TESTS: '1'
          ARTIFACTORY_NATIVE_EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: cargo test --locked -p artifactory-emissary --test native_service -- --ignored --nocapture
  compose-tls:
    needs: version-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Compose service health, HTTPS and tenant authentication
        run: python3 -u scripts/compose_acceptance.py
      - name: Preserve Compose diagnostics without private deployment files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-tls-diagnostics
          retention-days: 7
          include-hidden-files: true
          path: |
            .local/compose-tls/*/evidence.json
            .local/compose-tls/*/probe.log
            .local/compose-tls/*/services.log
            .local/compose-tls/*/startup.log
            .local/compose-tls/*/cleanup.log
            .local/compose-tls/*/*-build.log
            .local/compose-tls/*/probe/probe-evidence.json
