[package]
name = "artifactory-image-operator"
version.workspace = true
edition.workspace = true
rust-version = "1.95.0"
default-run = "artifactory-image-operator"

[features]
default = ["operator"]
operator = [
    "dep:artifactory-runtime-protocol",
    "dep:artifactory-source-checkout",
    "dep:artifactory-image-registry",
    "dep:artifactory-image-protocol",
    "dep:artifactory-emissary",
    "dep:async-trait",
    "dep:base64",
    "dep:chrono",
    "dep:futures",
    "dep:hex",
    "dep:kube",
    "dep:k8s-openapi",
    "dep:reqwest",
    "dep:schemars",
    "dep:serde",
    "dep:serde_json",
    "dep:serde_yaml",
    "dep:sha2",
    "dep:tempfile",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:uuid",
]

[dependencies]
artifactory-runtime-protocol = { path = "../../crates/runtime-protocol", optional = true }
artifactory-source-checkout = { path = "../../crates/source-checkout", optional = true }
artifactory-image-registry = { path = "../../crates/image-registry", optional = true }
anyhow = "1"
artifactory-image-protocol = { path = "../../crates/image-protocol", optional = true }
artifactory-emissary = { path = "../../crates/emissary", optional = true }
async-trait = { version = "0.1", optional = true }
base64 = { version = "0.22", optional = true }
chrono = { version = "0.4", optional = true }
futures = { version = "0.3", optional = true }
hex = { version = "0.4", optional = true }
kube = { version = "=5.0.0", features = ["runtime", "derive", "rustls-tls"], optional = true }
k8s-openapi = { version = "=0.29.0", features = ["v1_37", "schemars"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"], optional = true }
schemars = { version = "1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
serde_yaml = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }
tempfile = { version = "3", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
url = { version = "2", optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
libc = "0.2"

[[bin]]
name = "artifactory-image-operator"
required-features = ["operator"]
path = "src/main.rs"

[[bin]]
name = "artifactory-image-crdgen"
required-features = ["operator"]
path = "src/bin/crdgen.rs"

[[bin]]
name = "artifactory-image-runner"
required-features = ["operator"]
path = "src/bin/runner.rs"

[[bin]]
name = "artifactory-image-publisher"
required-features = ["operator"]
path = "src/bin/publisher.rs"

[dev-dependencies]
tempfile = "3"
axum = "0.8"

[[bin]]
name = "artifactory-image-buildkit"
path = "src/bin/buildkit.rs"
