[package]
name = "artifactory-image-operator"
version.workspace = true
edition.workspace = true
rust-version = "1.95.0"
default-run = "artifactory-image-operator"

[dependencies]
artifactory-source-checkout = { path = "../../crates/source-checkout" }
artifactory-image-registry = { path = "../../crates/image-registry" }
anyhow = "1"
artifactory-image-protocol = { path = "../../crates/image-protocol" }
artifactory-emissary = { path = "../../crates/emissary" }
async-trait = "0.1"
base64 = "0.22"
chrono = "0.4"
futures = "0.3"
hex = "0.4"
kube = { version = "=5.0.0", features = ["runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "=0.29.0", features = ["v1_37", "schemars"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[[bin]]
name = "artifactory-image-operator"
path = "src/main.rs"

[[bin]]
name = "artifactory-image-crdgen"
path = "src/bin/crdgen.rs"

[[bin]]
name = "artifactory-image-runner"
path = "src/bin/runner.rs"

[[bin]]
name = "artifactory-image-publisher"
path = "src/bin/publisher.rs"

[dev-dependencies]
axum = "0.8"
