# [INPUT]: Windows Rust 程序与本机证书库身份。
# [OUTPUT]: 构建、签名和验证非应用可执行程序。
# [POS]: Windows 宿主执行非应用目标的配方模板。
# [PROTOCOL]: Update this header on change, then check AGENTS.md
version: 1
release: {enabled: true}
targets:
  windows-amd64:
    os: windows
    arch: amd64
    application_platform: null
    capabilities: [cargo, signtool]
    signing_profiles: [windows-release]
    steps:
      - name: build
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/myapp.exe dist/myapp.exe
      - name: sign
        phase: sign
        run: signtool sign /fd SHA256 /td SHA256 /tr "$env:ARTIFACTORY_TIMESTAMP_URL" /sha1 "$env:ARTIFACTORY_WINDOWS_CERT_THUMBPRINT" dist/myapp.exe
      - name: verify
        phase: verify
        run: signtool verify /pa /all /v dist/myapp.exe
    artifacts: [dist/myapp.exe]
