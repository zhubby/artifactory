// [INPUT]: 依赖节点身份、任务租约与固定源码清单。
// [OUTPUT]: 定义任务、显式通知、终端、遥测与冻结OTA续签RPC。
// [POS]: 控制平面和 Emissary 的共享传输契约。
// [PROTOCOL]: Update this header on change, then check AGENTS.md
syntax = "proto3";
package artifactory.emissary.v1;

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollReply);
}

service Control {
  rpc Connect(stream EmissaryEvent) returns (stream Command);
  rpc UploadLogs(stream LogChunk) returns (LogAck);
  rpc PrepareArtifact(ArtifactRequest) returns (UploadTicket);
  rpc CompleteArtifact(CompleteArtifactRequest) returns (ArtifactRecord);
  rpc AcquireSourceMaterial(SourceMaterialRequest) returns (SourceMaterialReply);
  rpc AcquireSigningMaterial(SigningMaterialRequest) returns (SigningMaterialReply);
  rpc RecordSigningEvidence(SigningEvidenceRequest) returns (SigningEvidenceReply);
  rpc RenewEmissaryAsset(EmissaryAssetRenewRequest) returns (EmissaryAssetRenewReply);
}

// 仅以原节点证书为当前冻结更新续签下载票据。
message EmissaryAssetRenewRequest {
  string session_id = 1;
  string request_id = 2;
  string update_id = 3;
  int64 generation = 4;
  string manifest_sha256 = 5;
  string asset_sha256 = 6;
  uint64 asset_size = 7;
  string os = 8;
  string arch = 9;
}
message EmissaryAssetRenewReply {
  string request_id = 1;
  string update_id = 2;
  int64 generation = 3;
  string url = 4;
}

// 每个终端使用独立 mTLS 流，不占用构建命令或日志队列。
service Terminal {
  rpc Connect(stream TerminalFrame) returns (stream TerminalFrame);
}

// 仅在私有实例端点提供；调用端必须证明进程身份与会话委托。
service TerminalRelay {
  rpc Connect(stream TerminalFrame) returns (stream TerminalFrame);
}

message TerminalFrame {
  string terminal_id = 1;
  string kind = 2;
  bytes data = 3;
  uint64 offset = 4;
  uint32 columns = 5;
  uint32 rows = 6;
  string payload_json = 7;
}

message SourceMaterialRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string source_digest = 3;
}
message SourceMaterialReply { string material_json = 1; }

message SigningMaterialRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string session_id = 3;
  string profile = 4;
  string version_id = 5;
  uint32 step_index = 6;
}
message SigningMaterialReply { string material_json = 1; }
message SigningEvidenceRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string session_id = 3;
  string evidence_json = 4;
}
message SigningEvidenceReply { bool accepted = 1; }

// A separate endpoint, database and flow-control budget from execution traffic.
service Telemetry {
  rpc Negotiate(TelemetryNegotiateRequest) returns (TelemetryNegotiateReply);
  rpc Upload(TelemetryBatch) returns (TelemetryAck);
  rpc UploadInventory(InventoryObservation) returns (InventoryAck);
}
message TelemetryNegotiateRequest {
  repeated uint32 batch_schemas = 1;
  repeated uint32 inventory_schemas = 2;
  repeated string encodings = 3;
  repeated string features = 4;
}
message TelemetryNegotiateReply {
  repeated uint32 batch_schemas = 1;
  repeated uint32 inventory_schemas = 2;
  repeated string encodings = 3;
  repeated string features = 4;
  uint32 max_batch_bytes = 5;
  uint32 max_inventory_bytes = 6;
  int64 server_time_ms = 7;
}
message TelemetryBatch {
  bytes json = 1;
  // 0与1均解释为原JSON格式；不向严格JSON内部增加版本字段。
  uint32 schema_version = 2;
}
message TelemetryAck {
  string batch_id = 1;
  bool duplicate = 2;
  int64 server_time_ms = 3;
  string sha256 = 4;
  uint32 schema_version = 5;
}
message TelemetryRejectionDetails { string reason = 1; }
message InventoryObservation {
  string observation_id = 1;
  string source_startup_id = 2;
  uint64 revision = 3;
  int64 observed_at_ms = 4;
  uint64 monotonic_ms = 5;
  uint32 inventory_schema = 6;
  bytes inventory_json = 7;
  string delivery_digest = 8;
  // 非空时属于独立legacy命名空间，revision不参与新刷新排序。
  string source_batch_id = 9;
}
message InventoryAck {
  string observation_id = 1;
  string delivery_digest = 2;
  bool duplicate = 3;
  int64 server_time_ms = 4;
}

message EnrollRequest {
  string token = 1;
  string name = 2;
  string os = 3;
  string arch = 4;
  string csr_pem = 5;
  uint32 protocol_major = 6;
}
message EnrollReply {
  string emissary_id = 1;
  string certificate_pem = 2;
  string ca_pem = 3;
  uint32 heartbeat_seconds = 4;
  uint32 lease_seconds = 5;
  string telemetry_endpoint = 6;
}
message EmissaryEvent {
  string emissary_id = 1;
  string kind = 2;
  string attempt_id = 3;
  string lease_token = 4;
  uint64 sequence = 5;
  string command_id = 6;
  string payload_json = 7;
  uint32 protocol_major = 8;
}
message Step {
  string name = 1;
  string phase = 2;
  string shell = 3;
  string run = 4;
  uint32 timeout_seconds = 5;
}
message Assignment {
  string job_id = 1;
  string build_id = 2;
  string target = 3;
  repeated Step steps = 6;
  repeated string artifacts = 7;
  map<string, string> environment = 8;
  repeated string signing_profiles = 9;
  uint32 timeout_seconds = 11;
  string source_manifest_json = 12;
  string plan_revision_id = 13;
  repeated ExternalScript scripts = 14;
  string managed_signing_json = 15;
}
message ExternalScript { string name = 1; string content = 2; string sha256 = 3; }
message Command {
  string command_id = 1;
  string kind = 2;
  string attempt_id = 3;
  string lease_token = 4;
  uint32 lease_seconds = 5;
  Assignment assignment = 6;
  string message = 7;
  string request_id = 8;
  uint64 ack_sequence = 9;
  // Emissary-level commands (emissary_update / emissary_health) have no attempt ID.
  // OTA v1 is negotiated by the emissary-ota-v1 hello capability; protocol stays 1.
  string payload_json = 10;
  string signing_session_id = 11;
  // 仅向声明command-notification-v1的设备发送。
  // 仅未知kind可忽略；执行、租约和授权字段必须为空。
  // 已知kind始终执行原校验，默认false保留未知命令拒收。
  bool ignorable_notification = 12;
}
message LogChunk {
  string attempt_id = 1;
  string lease_token = 2;
  uint64 sequence = 3;
  string step = 4;
  bytes data = 5;
}
message LogAck { uint64 through_sequence = 1; }
message ArtifactRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string path = 3;
  uint64 size = 4;
  string sha256 = 5;
}
message UploadTicket {
  string upload_id = 1;
  string url = 2;
  uint32 expires_seconds = 3;
}
message CompleteArtifactRequest {
  string attempt_id = 1;
  string lease_token = 2;
  string upload_id = 3;
}
message ArtifactRecord {
  string artifact_id = 1;
  string path = 2;
  string sha256 = 3;
  uint64 size = 4;
}
