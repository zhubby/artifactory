[workspace]
members = ["crates/control-plane", "crates/planning-protocol", "crates/service-transport", "crates/execution-support", "crates/planning-coordinator", "crates/source-checkout", "crates/source-preparer", "crates/emissary-protocol", "crates/emissary", "crates/database", "crates/telemetry-service", "operators/planning-operator", "crates/image-protocol", "operators/image-operator", "crates/oci-registry-client", "crates/gateway"]
exclude = ["vendor/toasty", "vendor/toasty-driver-postgresql"]
resolver = "2"

[workspace.dependencies]
toasty = { version = "=0.11.0", default-features = false, features = ["postgresql", "serde", "jiff", "migration"] }
toasty-core = { version = "=0.11.0", default-features = false }
jiff = "0.2"

[workspace.package]
version = "0.2.5"
edition = "2024"
license = "MIT"

[profile.release]
lto = "thin"
strip = true

# Toasty 0.11.0 with the connection-recycling fix described in vendor/toasty/PATCH.md.
[patch.crates-io]
toasty = { path = "vendor/toasty" }
toasty-driver-postgresql = { path = "vendor/toasty-driver-postgresql" }
