[package]
name = "artifactory-emissary-protocol"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tonic = "0.14"
tonic-prost = "0.14"
uuid = { version = "1", features = ["v4", "serde"] }

[build-dependencies]
tonic-prost-build = "0.14"
