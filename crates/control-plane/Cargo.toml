[package]
name = "artifactory-control-plane"
version.workspace = true
edition.workspace = true

[dependencies]
artifactory-planner-runtime = { path = "../planner-runtime" }
artifactory-image-registry = { path = "../image-registry" }
jsonwebtoken = "9"
kube = { version = "=5.0.0", default-features = false, features = ["client", "rustls-tls"] }
k8s-openapi = { version = "=0.29.0", features = ["v1_37"] }
artifactory-image-protocol = { path = "../image-protocol" }
artifactory-telemetry-model = { path = "../telemetry-model" }
artifactory-emissary-protocol = { path = "../emissary-protocol" }
artifactory-database = { path = "../database" }
artifactory-runtime-protocol = { path = "../runtime-protocol" }
artifactory-source-checkout = { path = "../source-checkout" }
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
prost = "0.14"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "json"] }
rusty-s3 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toasty.workspace = true
jiff.workspace = true
jks = { version = "0.3.3", default-features = false, features = ["rand"] }
p12-keystore = "0.4.1"
ring = "0.17"
x509-parser = "0.18"
zeroize = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
